name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # GitHub-hosted Xcode 27 image (arm64).
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Lint Swift formatting
        run: >-
          xcrun swift-format lint --strict --configuration .swift-format
          --recursive timezone-buddy timezone-buddyTests timezone-buddyUITests

      - name: Build
        run: >-
          xcodebuild build -quiet -project timezone-buddy.xcodeproj
          -scheme timezone-buddy -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Test
        run: >-
          xcodebuild test -quiet -project timezone-buddy.xcodeproj
          -scheme timezone-buddy -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
